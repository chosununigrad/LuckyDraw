<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>추첨지 자동 생성기</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f3f5f9;color:#222}
.wrap{max-width:1000px;margin:0 auto;padding:24px}
h1{font-size:24px;margin:0 0 16px}
.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px #0001;margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:12px}
label{font-size:14px}
input[type=number],select{padding:6px;border:1px solid #ccd;border-radius:6px;width:80px}
select{width:auto}
button{padding:10px 18px;border:0;border-radius:8px;background:#1a56db;color:#fff;font-size:15px;cursor:pointer}
button.sub{background:#667}
.info{font-size:13px;color:#667;margin-top:8px;line-height:1.6}
.drop{border:2px dashed #99a;border-radius:10px;padding:24px;text-align:center;cursor:pointer;background:#fafbff}
.drop.on{background:#e8f0ff;border-color:#1a56db}
.sheet{display:grid;background:#fff;width:190mm;height:277mm;margin:0 auto 16px;box-shadow:0 1px 6px #0002}
.slip{border:1px dashed #888;display:flex;flex-direction:row;overflow:hidden}
.part{display:flex;flex-direction:column;padding:2mm 3mm 2.5mm;gap:1.5mm;min-width:0;overflow:hidden}
.part.l{flex:1.9}
.part.r{flex:1;border-left:1.5px dashed #555;align-items:stretch}
.rno{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.logos{display:flex;align-items:center;justify-content:space-between;height:5mm;flex:none;border-bottom:1px solid #ddd;padding-bottom:1mm}
.logos img{height:100%;width:auto;max-width:48%;object-fit:contain}
.body{flex:1;display:flex;gap:3mm;min-height:0}
.info-col{flex:1.3;display:flex;flex-direction:column;justify-content:center;gap:.6mm;min-width:0;overflow:hidden;font-size:3.6mm}
.f{display:flex;font-size:1em;line-height:1.2}
.f .k{width:4.2em;flex:none;color:#555;font-size:.85em}
.f .v{font-weight:600;word-break:keep-all;overflow-wrap:anywhere;min-width:0}
.f.nm .v{font-size:1.2em;font-weight:800}
.no-col{flex:1;display:flex;align-items:center;justify-content:center;border-left:1px solid #bbb;padding-left:3mm}
.no{font-weight:900;line-height:1}
.slip.blank{border-style:dashed}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff}
 .wrap{padding:0;max-width:none}
 .noprint{display:none!important}
 .sheet{box-shadow:none;margin:0;page-break-after:always}
 .sheet:last-child{page-break-after:auto}
}

.part.l{flex-direction:row;align-items:stretch;gap:3mm}
.part.l .logos{flex-direction:column;justify-content:center;gap:2mm;width:32mm;height:auto;border-bottom:0;border-right:1px solid #ddd;padding:0 2mm 0 0}
.part.l .logos img{height:auto;width:100%;max-width:100%;max-height:15mm}
.part.l .body{flex:1;min-width:0}
.part{padding:1.5mm 3mm}

.part{position:relative;padding-top:5mm}
.evt{position:absolute;top:1mm;left:0;right:0;text-align:center;font-size:2.8mm;font-weight:700;color:#1a3a7a;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.part.r .evt{font-size:2.3mm}

.evt{top:0!important;height:4.2mm;line-height:4.2mm;background:#1a56db!important;color:#fff!important;font-weight:800!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.part{padding-top:5.5mm!important}

.evt{font-size:3.5mm!important;height:4.8mm!important;line-height:4.8mm!important}
.part.r .evt{font-size:3mm!important}
.part{padding-top:6mm!important}

.part.r .evt{white-space:normal!important;height:7.6mm!important;line-height:3.6mm!important;font-size:2.9mm!important}
.part.r{padding-top:9mm!important}

.part.r .evt{white-space:nowrap!important;height:4.8mm!important;line-height:4.8mm!important;padding:0 1mm}
.part.r{padding-top:6mm!important}
</style>
</head>
<body>
<div class="wrap">
<div class="noprint">
<h1>🎟️ 추첨지 자동 생성기</h1>
<div class="panel">
<div class="drop" id="drop" onclick="document.getElementById('file').click()">
 📂 엑셀 파일(.xlsx / .xls / .csv)을 끌어놓거나 클릭해서 선택<br>
 <span class="info">열 제목: 학적구분 · 학과 · 학번 · 생년월일 · 성명 (제목이 없으면 이 순서대로 읽습니다)</span>
</div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
<div class="row">
<label>번호 시작 <input type="number" id="start" value="1" min="0"></label>
<label>한 장당 <select id="cols"><option value="1" selected>1열 (한 줄=한 사람)</option></select>
 × <select id="rows"><option selected>7</option><option>8</option><option>10</option></select>행</label>
<label><input type="checkbox" id="shuffleOrder"> 출력 순서도 섞기</label>
<label><input type="checkbox" id="maskBirth"> 생년월일 뒷자리 가리기</label>
</div>
<div class="row">
<button onclick="gen()">추첨지 생성</button>
<button class="sub" onclick="window.print()">인쇄 / PDF 저장</button>
<button class="sub" onclick="downloadCsv()">배정표 CSV</button>
<button class="sub" onclick="sample()">샘플 엑셀 받기</button>
</div>
<div class="info" id="info">엑셀을 올리면 번호가 중복 없이 무작위로 배정됩니다. 인쇄 시 배율 100%로 설정하세요. (엑셀 읽기 기능은 인터넷 연결이 필요합니다.)</div>
</div>
</div>
<div id="preview"></div>
</div>

const KEYS=['학적구분','학과','학번','생년월일','성명'];
let people=[], result=[];

const drop=document.getElementById('drop'), fileIn=document.getElementById('file');
fileIn.onchange=e=>e.target.files[0]&&load(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};

function fmtDate(v){
 if(v==null||v==='')return '';
 if(v instanceof Date){return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0')}
 if(typeof v==='number'&&v>10000&&v<80000){const d=new Date(Math.round((v-25569)*86400000));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
 return String(v).trim();
}
function load(f){
 const r=new FileReader();
 r.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
   const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
   if(!rows.length)throw new Error('빈 파일');
   const head=rows[0].map(x=>String(x).replace(/\s/g,''));
   const hasHead=KEYS.some(k=>head.includes(k));
   const idx={};
   KEYS.forEach((k,i)=>{const p=head.indexOf(k);idx[k]=hasHead&&p>=0?p:i});
   const body=hasHead?rows.slice(1):rows;
   people=body.filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>({
     type:String(r[idx['학적구분']]).trim(),
     dept:String(r[idx['학과']]).trim(),
     id:String(r[idx['학번']]).trim(),
     birth:fmtDate(r[idx['생년월일']]),
     name:String(r[idx['성명']]).trim()
   }));
   document.getElementById('info').textContent=`${f.name}: ${people.length}명 불러옴 → [추첨지 생성]을 누르세요.`;
   gen();
  }catch(err){alert('엑셀을 읽지 못했습니다: '+err.message)}
 };
 r.readAsArrayBuffer(f);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function gen(){
 if(!people.length){alert('먼저 엑셀 파일을 올려주세요.');return}
 const start=parseInt(document.getElementById('start').value)||1;
 const cols=+document.getElementById('cols').value, rows=+document.getElementById('rows').value;
 const per=cols*rows, mask=document.getElementById('maskBirth').checked;
 const nums=shuffle(people.map((_,i)=>start+i));
 result=people.map((p,i)=>({no:nums[i],...p})).sort((a,b)=>a.no-b.no);
 let items=document.getElementById('shuffleOrder').checked?shuffle(result):result;
 const pages=Math.ceil(items.length/per);
 const digits=String(start+people.length-1).length;
 const slipW=190/cols;
 const noSize=Math.min(slipW*0.62*0.34/(digits*0.6), (277/rows-9)*0.6, 22);
 const rSize=Math.min(slipW*0.34*0.8/(digits*0.6), (277/rows-9)*0.7, 30);
 let html='';
 for(let p=0;p<pages;p++){
  html+=`<div class="sheet" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">`;
  for(let k=0;k<per;k++){
   const it=items[p*per+k];
   if(!it){html+='<div class="slip blank"></div>';continue}
   let b=it.birth; if(mask&&b) b=b.replace(/^(\d{4}).*$/,'$1-**-**');
   html+=`<div class="slip"><div class="part l"><div class="evt">조선대학교 웰에이징대학원 출범식·오픈하우스 추첨권</div><div class="logos"><img src="${LOGO_A}" alt=""><img src="${LOGO_G}" alt=""></div><div class="body"><div class="info-col">
    <div class="f"><span class="k">학적구분</span><span class="v">${esc(it.type)}</span></div>
    <div class="f"><span class="k">학과</span><span class="v">${esc(it.dept)}</span></div>
    <div class="f"><span class="k">학번</span><span class="v">${esc(it.id)}</span></div>
    <div class="f"><span class="k">생년월일</span><span class="v">${esc(b)}</span></div>
    <div class="f nm"><span class="k">성명</span><span class="v">${esc(it.name)}</span></div>
   </div><div class="no-col"><div class="no" style="font-size:${noSize}mm">${it.no}</div></div></div></div><div class="part r"><div class="evt">조선대학교 웰에이징대학원 출범식·오픈하우스 추첨권</div><div class="logos"><img src="${LOGO_A}" alt=""><img src="${LOGO_G}" alt=""></div><div class="rno"><div class="no" style="font-size:${rSize}mm">${it.no}</div></div></div></div>`;
  }
  html+='</div>';
 }
 document.getElementById('preview').innerHTML=html;
 fit();
 document.getElementById('info').textContent=`총 ${people.length}명 / ${pages}페이지 (번호 ${start}~${start+people.length-1})`;
}
function fit(){
 document.querySelectorAll('.part.r .evt').forEach(e=>{
  let fs=3;e.style.setProperty('font-size',fs+'mm','important');
  while(e.scrollWidth>e.clientWidth&&fs>1.2){fs-=0.1;e.style.setProperty('font-size',fs+'mm','important')}
 });
 document.querySelectorAll('.info-col').forEach(c=>{
  let fs=3.6;c.style.fontSize=fs+'mm';
  while((c.scrollHeight>c.clientHeight+1||c.scrollWidth>c.clientWidth+1)&&fs>1.8){fs-=0.15;c.style.fontSize=fs+'mm'}
 });
}
window.addEventListener('beforeprint',fit);
function downloadCsv(){
 if(!result.length){alert('먼저 생성해주세요.');return}
 const q=s=>`"${String(s).replace(/"/g,'""')}"`;
 const csv='\ufeff번호,학적구분,학과,학번,생년월일,성명\n'+result.map(r=>[r.no,q(r.type),q(r.dept),q(r.id),q(r.birth),q(r.name)].join(',')).join('\n');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
 a.download='추첨_배정표.csv';a.click();
}
function sample(){
 const ws=XLSX.utils.aoa_to_sheet([KEYS,['대학원생','간호학과','20260001','1990-03-15','홍길동'],['학부생','해양공학과','20250123','2002-11-02','김철수']]);
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'명단');
 XLSX.writeFile(wb,'추첨명단_샘플.xlsx');
}
</script>
